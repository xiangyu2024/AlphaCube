[project]
name = "alphacube"
version = "0.1.0"
description = "Three-axis (stock x day x minute) factor computation and mining"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1", "scikit-learn>=1.3", "scipy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
